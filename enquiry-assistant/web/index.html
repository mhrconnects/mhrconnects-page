<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Away Ashton - Chat</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="chat">
  <header>
    <strong>Fire Away Ashton</strong>
    <span>Enquiry assistant (demo)</span>
  </header>
  <div id="log" class="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="msg" type="text" maxlength="500" placeholder="Type your message..." aria-label="Your message" required>
    <button type="submit">Send</button>
  </form>
  <footer>Demo: please use fake details. Details you give are only used to contact you about your enquiry.</footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
